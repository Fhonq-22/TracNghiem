<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/DangKyView.js"></script>
</head>
<body>
    <h1>Đăng ký tài khoản</h1>

    <form id="registerForm">
        <input type="text" id="username" placeholder="Tên người dùng"><br><br>
        <input type="text" id="fullName" placeholder="Họ tên"><br><br>
        <input type="email" id="email" placeholder="Email"><br><br>
        <input type="password" id="password" placeholder="Mật khẩu"><br><br>
        <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu"><br><br>

        <p>
            Bằng việc đăng ký, bạn đồng ý với
            <a href="s-dieukhoan.html" target="_blank"> Điều khoản sử dụng</a> và
            <a href="s-chinhsach.html" target="_blank"> Chính sách bảo mật </a>
            của chúng tôi.
        </p>

        <button type="submit">Đăng ký</button>
    </form>

    <p>Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
</body>
</html>
