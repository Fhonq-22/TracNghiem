<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bộ đề</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/Admin/QLBoDeView.js"></script>
    <link rel="stylesheet" href="./Assets/css/QL-BoDe.css">
</head>
<body>

<h1>Quản lý bộ đề</h1>
<a href="admin.html">← Quay về trang quản trị</a>

<button id="btnAddBoDe">Thêm bộ đề</button>

<table id="boDeTable">
    <thead>
        <tr>
            <th>Mã bộ đề</th>
            <th>Tên bộ đề</th>
            <th>Cấp độ</th>
            <th>Số câu hỏi</th>
            <th>Thời gian (phút)</th>
            <th>Ngày tạo</th>
            <th>Người tạo</th>
            <th>Hành động</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="pagination"></div>

<div id="boDeModal" style="display:none">
    <div class="modal-content">
        <h3 id="modalTitle">Thêm bộ đề</h3>

        <label>Tên bộ đề</label>
        <input type="text" id="modalTenBoDe">

        <label>Cấp độ</label>
        <select id="modalCapDo"></select>

        <label>Thời gian (phút)</label>
        <input type="number" id="modalThoiGian" value="30">

        <label>Chọn câu hỏi</label>
        <div id="modalCauHoiList"></div>

        <div class="modal-actions">
            <button id="modalSave">Lưu</button>
            <button id="modalCancel">Hủy</button>
        </div>
    </div>
</div>

</body>
</html>
