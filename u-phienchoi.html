<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phiên chơi</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/User/PhienChoiView.js"></script>
</head>
<body>
    <h1>Phiên chơi</h1>
    <a href="index.html">← quay về</a>

    <div id="taoPhien">
        <h3>Tạo phiên chơi</h3>
        <input id="soNguoi" type="number" min="1" placeholder="Số người chơi">
        <div id="dsTen"></div>
        <input id="soVong" type="number" min="1" max="4" value="1">
        <button id="btnTaoPhien">Tạo phiên</button>
    </div>

    <div id="vaoPhien">
        <h3>Vào phiên</h3>
        <input id="maPhienInput" placeholder="Mã phiên chơi">
        <button id="btnVaoPhien">Vào</button>
    </div>

    <hr>

    <div id="phienContainer" style="display:none">
        <h3 id="thongTinPhien"></h3>

        <div id="chonChuDe">
            <select id="selectChuDe">
                <option value="">-- chọn chủ đề --</option>
                <option value="toan">Toán</option>
                <option value="tieng-viet">Tiếng Việt</option>
                <option value="khoa-hoc">Khoa học</option>
            </select>
            <button id="btnXacNhanChuDe">Xác nhận chủ đề</button>
        </div>

        <div id="lamBai" style="display:none">
            <div>
                <span>Thời gian: </span><span id="timer"></span>
            </div>
            <div id="questionContainer"></div>
            <button id="btnSubmit">Nộp bài</button>
        </div>
    </div>
</body>
</html>
