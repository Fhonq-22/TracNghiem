<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên chơi</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/User/PhienChoiView.js"></script>
    <link rel="stylesheet" href="./Assets/css/U-PhienChoi.css">
</head>
<body>
    <div class="page">
        <div class="page-header">
            <h1>Phiên chơi</h1>
            <a href="index.html" class="back-link">← Quay về trang chủ</a>
        </div>

        <hr>

        <div id="chonPhienSection" class="section">
            <h3>Tạo phiên chơi mới</h3>

            <div class="form-row">
                <label>Số người chơi:</label>
                <input type="number" id="soNguoiChoi" min="1" max="10">
                <button id="btnTaoDanhSach">Tạo danh sách</button>
            </div>

            <div id="dsNhapTen"></div>

            <div class="form-row">
                <label>Số vòng chơi (1–4):</label>
                <input type="number" id="soVong" min="1" max="4" value="1">
            </div>

            <button id="btnTaoPhien">Tạo phiên chơi</button>

            <hr>

            <h3>Tiếp tục phiên chơi</h3>

            <div class="form-row">
                <input type="text" id="maPhienNhap" placeholder="Nhập mã phiên chơi">
                <button id="btnVaoPhien">Vào phiên</button>
            </div>
        </div>

        <div id="dieuKhienSection" class="section" style="display:none">
            <h2>Điều khiển phiên chơi</h2>

            <div class="game-info">
                <p>
                    <b>Vòng:</b>
                    <span id="vongHienTai" class="highlight"></span> /
                    <span id="soVongHienThi"></span>
                </p>
                <p>
                    <b>Người chơi:</b>
                    <span id="nguoiChoiHienTai" class="highlight"></span>
                </p>
                <p>
                    <b>Chủ đề:</b>
                    <span id="chuDeHienTai">(chưa chọn)</span>
                </p>
            </div>

            <div class="form-row">
                <select id="selectChuDe">
                    <option value="">-- chọn chủ đề --</option>
                </select>
                <button id="btnChonChuDe" disabled>Xác nhận chủ đề</button>
            </div>

            <hr>

            <div id="lamCauHoiSection" style="display:none">
                <h3 id="tieuDeCauHoi"></h3>

                <div id="noiDungCauHoi"></div>

                <div id="dsPhuongAn"></div>

                <button id="btnTraLoi">Trả lời</button>

                <p id="ketQuaTraLoi"></p>

                <button id="btnGiaiThich" style="display:none">Hiển thị lời giải thích</button>

                <div id="giaiThichBox" style="display:none; margin-top:8px"></div>

                <div id="traLoiPhuSection" style="display:none">
                    <label>Người trả lời phụ:</label>
                    <select id="selectNguoiTraLoiPhu"></select>
                </div>

                <button id="btnNextCauHoi" disabled>Sang câu hỏi tiếp theo</button>
            </div>

            <hr>

            <button id="btnNext" disabled>Sang lượt tiếp theo</button>

            <h3>Danh sách người chơi</h3>
            <ul id="dsNguoiChoi"></ul>
        </div>
    </div>
</body>
</html>
