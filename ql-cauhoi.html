<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý câu hỏi</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/Admin/QLCauHoiView.js"></script>

    <link rel="stylesheet" href="./Assets/css/QuanLy.css">
    <link rel="stylesheet" href="./Assets/css/QL-CauHoi.css">
</head>
<body class="admin-page">

<div class="admin-container">

    <header class="admin-header">
        <div>
            <h1 id="tieu-de-trang">Quản lý câu hỏi</h1>
            <a href="admin.html" class="link-back">← Quay về trang quản trị</a>
        </div>
        <button id="btn-them">Thêm câu hỏi</button>
    </header>

    <section class="admin-content">
        <table class="bang-du-lieu">
            <thead id="bang-head">
                <tr>
                    <th>Mã câu hỏi</th>
                    <th>Nội dung</th>
                    <th>Phương án A</th>
                    <th>Phương án B</th>
                    <th>Phương án C</th>
                    <th>Phương án D</th>
                    <th>Đáp án</th>
                    <th>Giải thích</th>
                    <th>Người tạo</th>
                    <th>Ngày tạo</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="bang-body"></tbody>
        </table>
    </section>

    <div id="phan-trang" class="phan-trang"></div>

</div>

<div id="modal" class="modal hidden">
    <div class="modal-content">

        <h3 id="modal-title">Thêm câu hỏi</h3>

        <label class="checkbox-line">
            <input type="checkbox" id="tu-dong-ma" checked>
            Tạo mã tự động
        </label>

        <input type="text" id="ma-cau-hoi" placeholder="Mã câu hỏi">

        <textarea id="noi-dung" rows="3" placeholder="Nội dung câu hỏi"></textarea>

        <input type="text" class="phuong-an" placeholder="Phương án A">
        <input type="text" class="phuong-an" placeholder="Phương án B">
        <input type="text" class="phuong-an" placeholder="Phương án C">
        <input type="text" class="phuong-an" placeholder="Phương án D">

        <select id="dap-an-dung">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
        </select>

        <textarea id="giai-thich" rows="3" placeholder="Giải thích"></textarea>

        <div class="modal-actions">
            <button id="modal-luu">Lưu</button>
            <button id="modal-huy">Hủy</button>
        </div>

    </div>
</div>

</body>
</html>
