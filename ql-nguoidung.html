<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/Admin/QLNguoiDungView.js"></script>
</head>
<body>
    <h1>Quản lý người dùng</h1>
    <a href="admin.html">← Quay về trang quản trị</a>

    <button id="btnAddUser">Thêm người dùng</button>

    <table border="1" id="userTable">
        <thead>
            <tr>
                <th>Tên người dùng</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Ngày đăng ký</th>
                <th>Vai trò</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <!-- Modal Thêm/Sửa -->
    <div id="userModal" style="display:none; position:fixed; top:20%; left:35%; background:#fff; padding:20px; border:1px solid #000;">
        <h3 id="modalTitle">Thêm người dùng</h3>
        <input type="text" id="modalUsername" placeholder="Tên người dùng"><br><br>
        <input type="text" id="modalHoTen" placeholder="Họ tên"><br><br>
        <input type="text" id="modalEmail" placeholder="Email"><br><br>
        <input type="text" id="modalMatKhau" placeholder="Mật khẩu"><br><br>
        <select id="modalVaiTro">
            <option value="User">User</option>
            <option value="Admin">Admin</option>
        </select><br><br>
        <button id="modalSave">Lưu</button>
        <button id="modalCancel">Hủy</button>
    </div>
</body>
</html>
