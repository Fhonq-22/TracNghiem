<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/Admin/QLNguoiDungView.js"></script>
    <link rel="stylesheet" href="./Assets/css/QL-NguoiDung.css">
</head>
<body>

<h1>Quản lý người dùng</h1>
<a href="admin.html">← Quay về trang quản trị</a>

<button id="btnAddUser">Thêm người dùng</button>

<table id="userTable">
    <thead>
        <tr>
            <th>Tên người dùng</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Ngày đăng ký</th>
            <th>Vai trò</th>
            <th>Hành động</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="pagination"></div>

<div id="userModal" style="display:none">
    <div class="modal-content">
        <h3 id="modalTitle">Thêm người dùng</h3>

        <input type="text" id="modalUsername" placeholder="Tên người dùng">
        <input type="text" id="modalHoTen" placeholder="Họ tên">
        <input type="text" id="modalEmail" placeholder="Email">
        <input type="text" id="modalMatKhau" placeholder="Mật khẩu">

        <select id="modalVaiTro">
            <option value="User">User</option>
            <option value="Admin">Admin</option>
        </select>

        <div class="modal-actions">
            <button id="modalSave">Lưu</button>
            <button id="modalCancel">Hủy</button>
        </div>
    </div>
</div>

</body>
</html>
