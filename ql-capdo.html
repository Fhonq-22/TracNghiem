<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý cấp độ</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./Views/Admin/QLCapDoView.js"></script>
    <link rel="stylesheet" href="./Assets/css/QL-CapDo.css">
</head>
<body class="admin-page">

<div class="admin-container">

    <header class="admin-header">
        <div>
            <h1 id="tieu-de-trang">Quản lý cấp độ</h1>
            <a href="admin.html" class="link-back">← Quay về trang quản trị</a>
        </div>
        <button id="btn-them">Thêm cấp độ</button>
    </header>

    <section class="admin-content">
        <table class="bang-du-lieu">
            <thead>
                <tr>
                    <th>Mã cấp độ</th>
                    <th>Tên cấp độ</th>
                    <th>Điểm mỗi câu</th>
                    <th>Hệ số trả lời phụ</th>
                    <th>Ngày cập nhật</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="bang-body"></tbody>
        </table>
    </section>

    <div id="phan-trang" class="phan-trang"></div>

</div>

<div id="modal" class="modal hidden">
    <div class="modal-content">

        <h3 id="modal-title">Thêm cấp độ</h3>

        <input type="text" id="ten-cap-do" placeholder="Tên cấp độ">
        <input type="number" id="diem-moi-cau" placeholder="Điểm mỗi câu">
        <input type="number" step="0.1" id="he-so-tra-loi-phu" value="0.5">

        <div class="modal-actions">
            <button id="modal-luu">Lưu</button>
            <button id="modal-huy">Hủy</button>
        </div>

    </div>
</div>

</body>
</html>
